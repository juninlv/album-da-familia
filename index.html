<style>
:root{--bg:#f7f5ef;--paper:#fffefa;--ink:#252820;--muted:#797b70;--green:#536b4e;--green2:#40573d;--line:#ebe9e0;--gold:#c79b58;--shadow:0 18px 60px #3c392611}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login-wrap{min-height:100vh;display:grid;grid-template-columns:1fr .92fr}.login-art{position:relative;min-height:100vh;overflow:hidden;background:#516346}.login-art img{position:absolute;width:100%;height:100%;object-fit:cover;inset:0;opacity:.86}.login-art:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#19231ada 0%,transparent 67%),linear-gradient(90deg,#18251a38,transparent)}.art-copy{position:absolute;z-index:1;bottom:70px;left:clamp(36px,7vw,100px);right:48px;color:white}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2.6px;font-weight:700}.art-copy h1{font:600 clamp(40px,5.2vw,68px)/1.04 'Playfair Display',serif;margin:22px 0 16px;max-width:530px}.art-copy p{color:#ffffffda;max-width:390px;font-size:15px;line-height:1.8}.login-panel{display:flex;align-items:center;justify-content:center;padding:46px 30px}.login-card{width:min(410px,100%)}.brand{display:flex;gap:12px;align-items:center;margin-bottom:46px}.brand-icon{height:43px;width:43px;border-radius:14px;background:#e9ede3;color:var(--green);display:grid;place-items:center}.brand-name{font:600 19px 'Playfair Display',serif}.brand-tag{font-size:11px;color:var(--muted);margin-top:3px}.login-card h2{font:600 36px 'Playfair Display',serif;margin:0 0 10px;letter-spacing:-.5px}.sub{font-size:14px;color:var(--muted);line-height:1.65;margin:0 0 31px}.field-label{font-size:12px;font-weight:700;display:block;margin:0 0 8px}.input{width:100%;height:49px;padding:0 14px;border:1px solid #e5e3da;border-radius:10px;background:#fff;outline:none}.input:focus{border-color:#849778;box-shadow:0 0 0 3px #84977820}.btn{height:48px;border-radius:10px;border:0;padding:0 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:.18s}.btn-primary{background:var(--green);color:white;width:100%;margin-top:13px}.btn-primary:hover{background:var(--green2);transform:translateY(-1px)}.btn-google{background:white;border:1px solid var(--line);width:100%;color:#30312d}.btn-google:hover,.btn-outline:hover{background:#f5f4ef}.btn-outline{background:white;border:1px solid var(--line);color:var(--ink)}.or{display:flex;align-items:center;gap:13px;color:#99998e;font-size:11px;margin:22px 0}.or:before,.or:after{content:'';height:1px;background:var(--line);flex:1}.notice{border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.55;margin-top:15px}.notice.info{background:#f3f1e9;color:#686452}.notice.error{background:#fdf0ec;color:#a24d3f}.notice.success{background:#eef4eb;color:#476243}.login-foot{text-align:center;font-size:11px;color:#a3a398;margin-top:34px}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,5.2vw,78px);background:var(--paper);border-bottom:1px solid var(--line)}.top-left{display:flex;align-items:center;gap:13px}.top-left .brand{margin:0}.topbar-right{display:flex;gap:11px;align-items:center}.user-dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e7eadf;color:var(--green);font-size:13px;font-weight:700}.btn-small{height:38px;padding:0 13px;font-size:12px}.main{max-width:1230px;margin:0 auto;padding:42px 28px 80px}.welcome{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:30px}.kicker{font-size:11px;color:var(--green);letter-spacing:1.8px;font-weight:700;text-transform:uppercase}.welcome h1{font:600 clamp(32px,4vw,46px) 'Playfair Display',serif;margin:8px 0 7px}.welcome p{margin:0;color:var(--muted);font-size:14px}.welcome .btn{min-width:150px}.tabs{border-bottom:1px solid #e6e4da;display:flex;gap:28px;margin-bottom:24px}.tab{padding:12px 2px;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;font-size:13px}.tab.active{color:var(--green);border-color:var(--green)}.bar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}.count{font-size:13px;color:var(--muted)}.filters{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:8px 12px;border:1px solid var(--line);background:white;border-radius:30px;font-size:11px;color:#686a61}.chip.active{background:#e8ece3;border-color:#e8ece3;color:var(--green2);font-weight:700}.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px}.photo-card{background:white;border:1px solid #edebe3;border-radius:13px;overflow:hidden;box-shadow:0 4px 14px #34341c07;cursor:pointer;transition:transform .2s,box-shadow .2s}.photo-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.photo-card img{width:100%;height:198px;object-fit:cover;display:block;background:#e9e6dc}.photo-info{padding:12px 14px 14px}.photo-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.photo-meta{color:#929187;font-size:10px;margin-top:5px}.upload-panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:30px;max-width:740px}.dropzone{border:1.5px dashed #c8cec0;border-radius:13px;padding:43px 20px;text-align:center;background:#fafaf6;transition:.18s}.dropzone.drag{border-color:var(--green);background:#f0f4ed}.upload-icon{height:51px;width:51px;margin:0 auto 16px;border-radius:16px;background:#eaf0e6;color:var(--green);display:grid;place-items:center}.dropzone h3{font:600 21px 'Playfair Display',serif;margin:0 0 7px}.dropzone p{color:var(--muted);font-size:12px;margin:0 0 17px}.small-muted{font-size:11px;color:#99998f;margin-top:13px}.preview-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:18px}.preview{position:relative}.preview img{width:100%;height:105px;object-fit:cover;border-radius:9px}.preview button{position:absolute;top:5px;right:5px;border:0;border-radius:50%;background:#ffffffeb;width:25px;height:25px}.upload-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}.empty{grid-column:1/-1;text-align:center;padding:75px 20px;border:1px dashed #dcdbd2;border-radius:14px;color:var(--muted)}.empty strong{display:block;color:var(--ink);font:600 22px 'Playfair Display',serif;margin:12px 0 7px}.modal{position:fixed;z-index:5;inset:0;background:#141812b8;display:grid;place-items:center;padding:25px}.modal img{max-width:min(100%,1000px);max-height:80vh;object-fit:contain;border-radius:8px}.modal-inner{position:relative;text-align:center;color:white}.modal-close{position:absolute;right:-12px;top:-42px;background:#ffffff20;border:0;color:white;width:36px;height:36px;border-radius:50%;font-size:22px}.modal-caption{font-size:13px;margin-top:12px}.setup-hint{font-size:10px;color:#aaa99e;margin-top:24px;line-height:1.65}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:10;background:#252820;color:white;padding:12px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);max-width:90vw}.spinner{width:14px;height:14px;border:2px solid #ffffff70;border-top-color:white;border-radius:50%;animation:spin .65s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:920px){.gallery{grid-template-columns:repeat(3,minmax(0,1fr))}.photo-card img{height:175px}}@media(max-width:680px){.login-wrap{grid-template-columns:1fr}.login-art{display:none}.login-panel{min-height:100vh;padding:30px 25px}.brand{margin-bottom:42px}.login-card h2{font-size:32px}.topbar{height:66px;padding:0 17px}.main{padding:32px 17px 60px}.welcome{align-items:start;flex-direction:column}.welcome .btn{width:100%}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.photo-card img{height:150px}.photo-info{padding:10px}.bar{align-items:flex-start;flex-direction:column}.filters{gap:6px}.chip{padding:7px 10px}.tabs{gap:23px}.upload-panel{padding:16px}.dropzone{padding:35px 15px}.top-left .brand-tag{display:none}.btn-small{height:35px;padding:0 10px}.topbar-right{gap:7px}}
</style></head><body>
<div id="app"></div>
<script type="module">
const SUPABASE_URL=''; // Cole aqui a URL do seu projeto Supabase
const SUPABASE_ANON_KEY=''; // Cole aqui a chave pública anon/publishable (nunca use service_role)
const PHOTO_URLS={}; // Opcional: associe photo id a URL de imagem de capa para galeria demo
const DEMO_PHOTOS=[
{id:'demo-1',title:'Manhãs que ficam com a gente',date:'Álbum de inspiração',category:'Viagens',url:'https://images.unsplash.com/photo-1478131143081-80f7f84ca84d?auto=format&fit=crop&w=900&q=85'},
{id:'demo-2',title:'Um lugar para voltar',date:'Álbum de inspiração',category:'Viagens',url:'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=85'},
{id:'demo-3',title:'Pequenas grandes alegrias',date:'Álbum de inspiração',category:'Momentos',url:'https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&w=900&q=85'},
{id:'demo-4',title:'A casa cheia',date:'Álbum de inspiração',category:'Momentos',url:'https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=900&q=85'},
{id:'demo-5',title:'Depois da chuva',date:'Álbum de inspiração',category:'Lugares',url:'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=85'},
{id:'demo-6',title:'Uma tarde sem pressa',date:'Álbum de inspiração',category:'Momentos',url:'https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=900&q=85'},
{id:'demo-7',title:'Memórias de verão',date:'Álbum de inspiração',category:'Viagens',url:'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=85'},
{id:'demo-8',title:'Nossa paisagem favorita',date:'Álbum de inspiração',category:'Lugares',url:'https://images.unsplash.com/photo-1472396961693-142e6e269027?auto=format&fit=crop&w=900&q=85'}
];
let sb=null,session=null,tab='gallery',photos=[],selectedFiles=[],filter='Todas',authAction='login',toastTimer;
const $=s=>document.querySelector(s);const el=(tag,cls='',text='')=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text)n.textContent=text;return n};
const configured=()=>SUPABASE_URL.startsWith('https://')&&SUPABASE_ANON_KEY.length>15;
async function init(){if(configured()){try{const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2');sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{flowType:'pkce',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const res=await sb.auth.getSession();session=res.data.session;sb.auth.onAuthStateChange((_e,s)=>{session=s;render()})}catch(e){console.error(e)}}render()}
function render(){document.body.style.background=session?'var(--bg)':'var(--bg)';if(!session){renderAuth();return}renderApp()}
function renderAuth(){const root=$('#app');root.innerHTML=`<div class="login-wrap"><section class="login-art"><img src="https://images.unsplash.com/photo-1511988617509-a57c8a288659?auto=format&fit=crop&w=1600&q=90" alt="Família reunida ao ar livre"><div class="art-copy"><span class="eyebrow">HISTÓRIAS QUE SÃO NOSSAS</span><h1>Um lugar para guardar o que importa.</h1><p>As lembranças mais bonitas não ficam só nas fotos. Ficam com a gente, para sempre.</p></div></section><section class="login-panel"><div class="login-card"><div class="brand"><span class="brand-icon">${icon('aperture')}</span><div><div class="brand-name">Casa de Memórias</div><div class="brand-tag">Seu álbum, sua história</div></div></div><h2 id="auth-title">${authAction==='login'?'Bem-vindo de volta':'Entre com seu e-mail'}</h2><p class="sub" id="auth-sub">Um cantinho privado para compartilhar as memórias da família.</p><button id="google" class="btn btn-google">${icon('google')} Continuar com Google</button><div class="or">OU ENTRE COM E-MAIL</div><label class="field-label" for="email">Seu e-mail</label><input class="input" id="email" type="email" autocomplete="email" placeholder="voce@exemplo.com"><button id="email-btn" class="btn btn-primary">${authAction==='otp'?'Enviar novo código':'Enviar código por e-mail'}</button><div id="auth-msg"></div><div class="setup-hint" id="setup-hint">${configured()?'O código de acesso chegará à sua caixa de entrada.':'Para ativar o acesso privado, conecte o projeto ao Supabase. A configuração está no guia incluído.'}</div><div class="login-foot">Um espaço privado, feito para compartilhar com quem você ama.</div></div></section></div>`;
$('#google').onclick=async()=>{if(!needSetup())return;const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});if(error)authMsg(error.message,'error')};$('#email-btn').onclick=sendEmail;$('#email').onkeydown=e=>{if(e.key==='Enter')sendEmail()};if(authAction==='otp'){$('#auth-title').textContent='Confira seu e-mail';$('#auth-sub').textContent='Digite o código de acesso que enviamos. Ele expira em breve.';$('#email').type='text';$('#email').inputMode='numeric';$('#email').placeholder='Código de 6 dígitos';$('#email').autocomplete='one-time-code';$('#email').value=sessionStorage.getItem('album-email')||'';$('#email-btn').textContent='Confirmar código';$('#email-btn').onclick=verifyOtp;const back=el('button','btn btn-outline');back.style.cssText='width:100%;margin-top:9px';back.textContent='Voltar';back.onclick=()=>{authAction='login';renderAuth()};$('#auth-msg').after(back)}}
function needSetup(){if(sb)return true;authMsg('O acesso ainda não foi conectado ao Supabase. Siga o guia de configuração incluído no projeto.','info');return false}function authMsg(t,type){const x=$('#auth-msg');if(x){x.className='notice '+type;x.textContent=t}}
async function sendEmail(){if(!needSetup())return;const email=$('#email').value.trim();if(!/^\S+@\S+\.\S+$/.test(email)){authMsg('Informe um endereço de e-mail válido.','error');return}$('#email-btn').disabled=true;$('#email-btn').innerHTML='<span class="spinner"></span> Enviando';const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true,emailRedirectTo:location.href}});$('#email-btn').disabled=false;$('#email-btn').textContent='Enviar novo código';if(error){authMsg(error.message,'error');return}sessionStorage.setItem('album-email',email);authAction='otp';renderAuth();authMsg('Enviamos um código de acesso para '+email+'.','success')}
async function verifyOtp(){if(!needSetup())return;const token=$('#email').value.trim().replace(/\s/g,'');const email=sessionStorage.getItem('album-email');if(!token||!email){authMsg('Informe o código recebido por e-mail.','error');return}$('#email-btn').disabled=true;$('#email-btn').innerHTML='<span class="spinner"></span> Verificando';const {data,error}=await sb.auth.verifyOtp({email,token,type:'email'});$('#email-btn').disabled=false;$('#email-btn').textContent='Confirmar código';if(error){authMsg('Não foi possível confirmar. Confira o código ou solicite outro.','error');return}session=data.session;authAction='login';sessionStorage.removeItem('album-email');await loadPhotos();render()}
function renderApp(){const name=session.user.email?.split('@')[0]||'família';$('#app').innerHTML=`<header class="topbar"><div class="top-left"><div class="brand"><span class="brand-icon">${icon('aperture')}</span><div><div class="brand-name">Casa de Memórias</div><div class="brand-tag">Seu álbum, sua história</div></div></div></div><div class="topbar-right"><span class="user-dot">${esc(name[0].toUpperCase())}</span><button id="signout" class="btn btn-outline btn-small">Sair</button></div></header><main class="main"><section class="welcome"><div><div class="kicker">NOSSO ÁLBUM DE FAMÍLIA</div><h1>As nossas memórias</h1><p>Um lugar para guardar cada pedacinho da nossa história.</p></div><button class="btn btn-primary" id="quick-upload">${icon('plus')} Adicionar fotos</button></section><nav class="tabs"><button data-tab="gallery" class="tab ${tab==='gallery'?'active':''}">Galeria</button><button data-tab="upload" class="tab ${tab==='upload'?'active':''}">Enviar fotos</button></nav><section id="content"></section></main><div id="modal-root"></div><div id="toast-root"></div>`;$('#signout').onclick=async()=>{if(sb)await sb.auth.signOut();session=null;photos=[];render()};$('#quick-upload').onclick=()=>{tab='upload';renderApp()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderApp()});tab==='gallery'?renderGallery():renderUpload()}
async function loadPhotos(){if(!sb)return;const {data,error}=await sb.from('photos').select('*').order('created_at',{ascending:false});if(error){console.error(error);return}photos=await Promise.all((data||[]).map(async p=>{const {data:u,error:e}=await sb.storage.from('family-photos').createSignedUrl(p.storage_path,3600);return {...p,title:p.title||p.file_name||'Memória de família',category:p.category||'Momentos',date:new Date(p.created_at).toLocaleDateString('pt-BR',{day:'numeric',month:'short',year:'numeric'}),url:e?'':u.signedUrl}}));}
// Renova links de fotos assinados quando a aba volta para o primeiro plano.
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&session&&sb)loadPhotos().then(()=>{if(tab==='gallery'&&$('#content'))renderGallery()})});
function demoPhotos(){return DEMO_PHOTOS.map(p=>({...p,url:PHOTO_URLS[p.id]||p.url}))}function renderGallery(){const c=$('#content');let all=photos.length?photos:demoPhotos();if(filter!=='Todas')all=all.filter(p=>p.category===filter);const cats=['Todas',...new Set((photos.length?photos:demoPhotos()).map(p=>p.category))];c.innerHTML=`<div class="bar"><div class="count">${photos.length?`${photos.length} ${photos.length===1?'foto':'fotos'} no álbum`:'Um álbum de inspiração'}</div><div class="filters">${cats.map(x=>`<button class="chip ${filter===x?'active':''}" data-filter="${esc(x)}">${esc(x)}</button>`).join('')}</div></div><div class="gallery" id="gallery-grid"></div>${!photos.length?'<div class="notice info" style="margin-top:18px">Prévia demonstrativa. Conecte o Supabase e envie fotos para criar seu álbum privado.</div>':''}`;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderGallery()});const grid=$('#gallery-grid');if(!all.length){grid.innerHTML='<div class="empty"><div style="font-size:30px">✿</div><strong>Ainda não há fotos por aqui</strong><span>Adicione a primeira lembrança da família.</span></div>';return}grid.innerHTML=all.map(p=>`<article class="photo-card" data-id="${esc(p.id)}"><img loading="lazy" src="${esc(p.url)}" alt="${esc(p.title)}"><div class="photo-info"><div class="photo-title">${esc(p.title)}</div><div class="photo-meta">${esc(p.date)} · ${esc(p.category)}</div></div></article>`).join('');grid.querySelectorAll('.photo-card').forEach(card=>card.onclick=()=>showPhoto(all.find(p=>p.id===card.dataset.id)))}
function showPhoto(p){if(!p)return;const root=$('#modal-root');root.innerHTML=`<div class="modal"><div class="modal-inner"><button class="modal-close" aria-label="Fechar">×</button><img src="${esc(p.url)}" alt="${esc(p.title)}"><div class="modal-caption">${esc(p.title)}${p.date?` · ${esc(p.date)}`:''}</div><div style="margin-top:14px"><button class="btn btn-outline btn-small" id="download-photo">${icon('download')} Baixar foto</button></div></div></div>`;root.querySelector('.modal').onclick=e=>{if(e.target.classList.contains('modal'))root.innerHTML=''};root.querySelector('.modal-close').onclick=()=>root.innerHTML='';$('#download-photo').onclick=()=>download(p)}
async function download(p){try{if(sb&&photos.includes(p)){const {data,error}=await sb.storage.from('family-photos').download(p.storage_path);if(error)throw error;const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=p.file_name||p.title||'foto';a.click();URL.revokeObjectURL(a.href)}else{const r=await fetch(p.url);const b=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(p.title||'foto')+'.jpg';a.click();URL.revokeObjectURL(a.href)}}catch(e){window.open(p.url,'_blank','noopener');showToast('Abrimos a foto em outra aba. Use a opção de salvar do navegador.')}}
function renderUpload(){const c=$('#content');c.innerHTML=`<div class="upload-panel"><div class="dropzone" id="dropzone"><div class="upload-icon">${icon('image')}</div><h3>Suas lembranças, aqui</h3><p>Arraste fotos para esta área ou escolha no seu dispositivo.</p><button class="btn btn-outline btn-small" id="pick">${icon('upload')} Escolher fotos</button><div class="small-muted">JPG, PNG, WEBP ou HEIC · até 15 MB por foto</div><input type="file" id="file-input" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" multiple hidden></div><div class="preview-list" id="previews"></div><div id="upload-msg"></div><div class="upload-actions"><span class="count" id="file-count">Nenhuma foto selecionada</span><button class="btn btn-primary btn-small" id="send-photos" disabled>${icon('upload')} Enviar para o álbum</button></div></div><div class="notice info" style="max-width:740px;margin-top:14px">${configured()?'As fotos só ficam visíveis para as pessoas autorizadas pelo seu álbum.':'O envio real será ativado ao conectar o projeto ao Supabase. Nenhuma foto é salva nesta prévia.'}</div>`;const input=$('#file-input'),drop=$('#dropzone');$('#pick').onclick=()=>input.click();input.onchange=()=>addFiles(input.files);drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');addFiles(e.dataTransfer.files)};$('#send-photos').onclick=uploadFiles}
function addFiles(files){for(const f of files){if(!f.type.startsWith('image/'))continue;if(f.size>15*1024*1024){uploadMsg(f.name+' ultrapassa o limite de 15 MB.','error');continue}selectedFiles.push(f)}renderPreviews()}
function renderPreviews(){const root=$('#previews');if(!root)return;root.innerHTML=selectedFiles.map((f,i)=>`<div class="preview"><img src="${URL.createObjectURL(f)}" alt="Prévia de ${esc(f.name)}"><button data-remove="${i}" aria-label="Remover foto">×</button></div>`).join('');root.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{selectedFiles.splice(+b.dataset.remove,1);renderPreviews()});$('#file-count').textContent=selectedFiles.length?`${selectedFiles.length} ${selectedFiles.length===1?'foto selecionada':'fotos selecionadas'}`:'Nenhuma foto selecionada';$('#send-photos').disabled=!selectedFiles.length}
function uploadMsg(t,type){const x=$('#upload-msg');if(x){x.className='notice '+type;x.textContent=t}}
async function uploadFiles(){if(!needSetup())return;if(!selectedFiles.length)return;const b=$('#send-photos');b.disabled=true;b.innerHTML='<span class="spinner"></span> Enviando';let errors=[];for(const f of selectedFiles){const id=crypto.randomUUID(),safe=f.name.replace(/[^\w.\- ]/g,'_'),path=`${session.user.id}/${id}-${safe}`;const {error:e}=await sb.storage.from('family-photos').upload(path,f,{upsert:false,contentType:f.type});if(e){errors.push(f.name+': '+e.message);continue}const {error:m}=await sb.from('photos').insert({user_id:session.user.id,storage_path:path,file_name:f.name,title:f.name.replace(/\.[^.]+$/,'')});if(m){errors.push(f.name+': '+m.message);await sb.storage.from('family-photos').remove([path])}}selectedFiles=[];b.disabled=false;b.innerHTML=icon('upload')+' Enviar para o álbum';renderPreviews();if(errors.length)uploadMsg('Algumas fotos não foram enviadas: '+errors.join(' · '),'error');else{uploadMsg('Fotos adicionadas ao álbum da família.','success');await loadPhotos();setTimeout(()=>{tab='gallery';renderApp()},1100)}}
function showToast(t){const r=$('#toast-root');r.innerHTML=`<div class="toast">${esc(t)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>r.innerHTML='',3500)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function icon(name){const paths={aperture:'<circle cx="12" cy="12" r="10"/><path d="m14.31 8 5.74 9.94M9.69 8h11.48M7.38 12l5.74-9.94m-5.74 13.94 5.74 9.94M9.69 16H-1.79M16.62 12l-5.74 9.94"/>',google:'<path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.4-.18-2.06H12v3.9h5.38a4.6 4.6 0 0 1-2 3.02v2.53h3.24c1.9-1.75 2.98-4.33 2.98-7.39Z"/><path fill="#34A853" d="M12 22c2.7 0 4.97-.9 6.62-2.38l-3.24-2.53c-.9.6-2.05.96-3.38.96-2.6 0-4.8-1.76-5.59-4.13H3.07v2.61A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.41 13.92a6 6 0 0 1 0-3.84V7.47H3.07a10 10 0 0 0 0 9.06l3.34-2.61Z"/><path fill="#EA4335" d="M12 5.95c1.47 0 2.79.5 3.82 1.52l2.87-2.87C16.96 2.98 14.7 2 12 2a10 10 0 0 0-8.93 5.47l3.34 2.61C7.2 7.71 9.4 5.95 12 5.95Z"/>',plus:'<path d="M12 5v14M5 12h14"/>',download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/>',image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5M12 3v12"/>'};return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||''}</svg>`}
init();
</script></body></html>
